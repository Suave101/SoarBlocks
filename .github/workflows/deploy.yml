name: Deploy Vite SPA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: soar-blockly-editor/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: soar-blockly-editor

      - name: Build project
        run: npm run build
        working-directory: soar-blockly-editor

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points to the dist directory inside your subdirectory
          path: soar-blockly-editor/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
